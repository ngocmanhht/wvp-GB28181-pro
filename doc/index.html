<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WVP-PRODocumentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="_media/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="./lib/css/vue.css">
    <!--  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/dark.css">-->
    <style>
        .cover {
            background: linear-gradient(to left bottom, hsl(82, 100%, 85%) 0%, hsl(199, 100%, 85%) 100%) !important;
        }
    </style>
</head>
<body>
<div id="app">Loading</div>
<script>
    window.$docsify = {
        name: 'WVP-RPOUse documentation',
        repo: 'https://github.com/648540858/wvp-GB28181-pro',
        loadSidebar: true, // Enable sidebar
        loadNavbar: true, // Enable navigation bar
        coverpage: true, // Open cover

        subMaxLevel: 3,
        plantuml: {
            skin: 'default',
        },
        search: {
            maxAge: 86400000, // Expiration time, in milliseconds, defaults to one day
            paths: 'auto', // or 'auto'
            placeholder: 'Search',
            noData: 'No results found',
            // Maximum level of search titles, 1 - 6
            depth: 4,
            hideOtherSidebarContent: false, // Whether to hide other sidebar content
        },
        copyCode: {
            buttonText: 'Copy',
            errorText: 'Error',
            successText: 'Copied'
        },
        // disqus: 'shortname'
    }
</script>
<!-- Docsify v4 -->
<script src="./lib/js/docsify@4.js"></script>
<script src="./lib/js/docsify-plantuml.min.js"></script>
<script src="./lib/js/search.min.js"></script>
<script src="./lib/js/zoom-image.min.js"></script>
<script src="./lib/js/docsify-copy-code.min.js"></script>

</script>
<!--  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/disqus.min.js"></script>-->
</body>
</html>
