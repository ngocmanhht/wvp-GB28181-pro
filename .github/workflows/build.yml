name: release-ubuntu

on:
  push:
    tags:
      - "v*.*.*" # The trigger condition is a push tag such asgit tag v2.7.4 git push origin v2.7.4

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
      max-parallel: 1 # Maximum number of parallels
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # github actionOperating environment

      - name: Create release # Create folder
        run: |
          rm -rf release 
          mkdir release
          echo ${{ github.sha }} > Release.txt
          cp Release.txt LICENSE release/
          cat Release.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # EclipseAn open source Java distribution maintained by the foundation. Use this because github action refers to Java.
          # Alsomicrosoft(openjdk distribution maintained by microsoft) oracle(CommercialSDK)Wait
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Node.jsVersion 20 The latest stable version of the series

      - name: clean maven cache
        run: rm -rf ~/.m2/repository/io/github/git-commit-id

      - name: Build Backend
        run: |
          mvn clean package

      - name: Compile frontend
        run: |
          cd ./web
          npm install
          npm run build:prod
          cd ../

      - name: Package Files
        run: |
          cp -r ./src/main/resources/static release/  # Copy frontend files
          cp ./target/*.jar release/     # Copy the JAR file
          cp ./src/main/resources/application-dev.yml release/application.yml
          
          BRANCH=${{ github.event.base_ref }}
          BRANCH_NAME=$(echo "$BRANCH" | grep -oP 'refs/heads/\K.*')
          echo "BRANCH_NAME= ${BRANCH_NAME}"
          # If unavailable, use default branch
          if [[ -z "BRANCH_NAME" ]]; then
            BRANCH_NAME="${{ github.event.repository.default_branch }}"
          fi
          
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ZIP_FILE_NAME="${BRANCH_NAME}-${TAG_NAME}.zip"
          zip -r "$ZIP_FILE_NAME" release
          echo "ZIP_FILE_NAME=$ZIP_FILE_NAME" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_FILE_NAME }}
