services:
  polaris-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s
    networks:
      - wvp-master-net
    volumes:
      - ./volumes/redis/data/:/data:z
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      REDISCLI_AUTH: "${REDIS_PWD:-wvp_redis_secure_password_2026}"
    command: redis-server --requirepass ${REDIS_PWD:-wvp_redis_secure_password_2026} --appendonly yes --protected-mode no --bind 0.0.0.0 --tcp-keepalive 300
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  polaris-mysql:
    image: mysql:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - wvp-master-net
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-wvp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wvp_password}
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d:z
      - ./logs/mysql:/logs:z
      - ./volumes/mysql/data:/var/lib/mysql:z
      - ../database/2.7.4/init-mysql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql:z
    command: [
        "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        "--default-time-zone=+07:00",
        "--lower-case-table-names=1",
      ]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # WVP Master - PURE CONTROL PLANE (Không kèm ZLMediaKit nội bộ)
  polaris-wvp:
    build:
      context: ..
      dockerfile: ./docker/wvp/Dockerfile
    restart: always
    networks:
      - wvp-master-net
    ports:
      - "18978:18978"                            # REST API WVP
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp" # SIP Signaling GB28181
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
    depends_on:
      polaris-redis:
        condition: service_healthy
      polaris-mysql:
        condition: service_healthy
    volumes:
      - ./wvp/config:/opt/wvp/config:z
      - ./wvp/wvp/:/opt/ylcx/wvp/:z
      - ./logs/wvp:/opt/wvp/logs/:z
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      RUN_ENV: "docker"
      JAVA_OPTS: "${JAVA_OPTS:--Xms1024m -Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/ylcx/}"
      REDIS_HOST: polaris-redis
      REDIS_PORT: 6379
      REDIS_PWD: "${REDIS_PWD:-wvp_redis_secure_password_2026}"
      DATABASE_HOST: polaris-mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER:-wvp_user}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-wvp_password}
      SIP_ShowIP: ${SIP_ShowIP:-127.0.0.1}
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain:-3402000000}
      SIP_Id: ${SIP_Id:-34020000002000000001}
      SIP_Password: ${SIP_Password:-wvp_sip_password}
      RecordSip: ${RecordSip:-false}
      RecordPushLive: ${RecordPushLive:-false}
      MEDIA_ID: "none"
      MEDIA_HTTP_PORT: 0
      MEDIA_AUTO_CONFIG: "false"
      # IP WVP dùng để ZLM node bắn webhook về (ZLM_HOOK_HOST)
      ZLM_HOOK_HOST: "${ZLM_HOOK_HOST:-127.0.0.1}"
      ZLM_HOOK_PORT: "${ZLM_HOOK_PORT:-80}"
      # Hỗ trợ cấu hình Multi CLUSTER_JOIN_TOKEN (phân tách bằng dấu phẩy)
      MEDIA_SECRET: "${MEDIA_SECRET:-wvp_cluster_join_secret_key_2026}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Web Admin Vue Frontend & Reverse Proxy
  polaris-nginx:
    build:
      context: ..
      dockerfile: ./docker/nginx/Dockerfile
    restart: always
    ports:
      - "${WebHttp:-80}:8080"
    depends_on:
      - polaris-wvp
    volumes:
      - ./nginx/templates/nginx-master.conf.template:/etc/nginx/templates/default.conf.template:z
      - ./logs/nginx:/var/log/nginx:z
    environment:
      Stream_IP: ${Stream_IP:-127.0.0.1}
    networks:
      - wvp-master-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  wvp-master-net:
    driver: bridge
