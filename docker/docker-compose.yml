version: "3"
services:
  polaris-redis:
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - media-net
    volumes:
      - ./redis/conf/redis.conf:/opt/polaris/redis/redis.conf
      - ./volumes/redis/data/:/data
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    command: redis-server /opt/polaris/redis/redis.conf --appendonly yes

  polaris-mysql:
    image: mysql:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - media-net
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-wvp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wvp_password}
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./logs/mysql:/logs
      - ./volumes/mysql/data:/var/lib/mysql
      - ../database/2.7.4/init-mysql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql
    command: [
        "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        "--default-time-zone=+07:00",
        "--lower-case-table-names=1",
      ]

  polaris-media:
    image: zlmediakit/zlmediakit:master
    restart: always
    networks:
      - media-net
    ports:
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/tcp"     # [collect flow] RTMP
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/udp"     # [collect flow] RTMP
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/tcp"       # [collect flow] RTSP
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/udp"       # [collect flow] RTSP
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/tcp"       # [collect flow] RTP
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/udp"       # [collect flow] RTP
      - "8000:8000/udp"                                   # WebRTC RTC UDP
      - "8000:8000/tcp"                                   # WebRTC RTC TCP
      - "30000-30500:30000-30500/udp"                     # GB28181 RTP Port Range UDP
      - "30000-30500:30000-30500/tcp"                     # GB28181 RTP Port Range TCP
    volumes:
      - ./volumes/video:/opt/media/bin/www/record/
      - ./logs/media:/opt/media/log/
      - ./media/config.ini:/conf/config.ini
    command: ["MediaServer", "-c", "/conf/config.ini", "-l", "0"]

  polaris-wvp:
    build:
      context: ..
      dockerfile: ./docker/wvp/Dockerfile
    restart: always
    networks:
      - media-net
    ports:
      - "18978:18978"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
    depends_on:
      polaris-redis:
        condition: service_healthy
      polaris-mysql:
        condition: service_healthy
      polaris-media:
        condition: service_started
    volumes:
      - ./wvp/config:/opt/wvp/config
      - ./wvp/wvp/:/opt/ylcx/wvp/
      - ./logs/wvp:/opt/wvp/logs/
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      RUN_ENV: "docker"
      Stream_IP: ${Stream_IP:-127.0.0.1}
      SDP_IP: ${SDP_IP:-127.0.0.1}
      ZLM_HOOK_HOST: polaris-wvp
      ZLM_HOOK_PORT: ${WebHttp:-80}
      ZLM_HOST: polaris-media
      ZLM_SECRET: ${ZLM_SECRET:-su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf}

      MediaHttp: ${WebHttp:-80}
      MediaRtmp: ${MediaRtmp:-10935}
      MediaRtsp: ${MediaRtsp:-5540}
      MediaRtp: ${MediaRtp:-10000}

      REDIS_HOST: polaris-redis
      REDIS_PORT: 6379

      DATABASE_HOST: polaris-mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER:-wvp_user}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-wvp_password}

      SIP_ShowIP: ${SIP_ShowIP:-127.0.0.1}
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain:-3402000000}
      SIP_Id: ${SIP_Id:-34020000002000000001}
      SIP_Password: ${SIP_Password:-wvp_sip_password}

      RecordSip: ${RecordSip:-true}
      RecordPushLive: ${RecordPushLive:-false}

  polaris-nginx:
    build:
      context: ..
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - "${WebHttp:-80}:8080"
    depends_on:
      - polaris-wvp
    volumes:
      - ./nginx/templates/:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
    environment:
      Stream_IP: ${Stream_IP:-127.0.0.1}
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
